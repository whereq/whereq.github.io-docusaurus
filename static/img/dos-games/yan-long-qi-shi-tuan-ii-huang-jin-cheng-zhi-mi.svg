  <!-- The subtitle band -->
  <rect x="0" y="200" width="256" height="56" fill="#07070C" opacity="0.92"/>
  <rect x="0" y="200" width="256" height="1.4" fill="#C41A18" opacity="0.8"/>
  <text x="128" y="228" text-anchor="middle" font-family="'Noto Serif CJK TC','Noto Serif TC','Songti TC','PMingLiU',serif" font-size="26" font-weight="700" fill="#F0D8A8" letter-spacing="5">黃金城之謎</text>
  <text x="128" y="247" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="700" fill="#8A93A8" letter-spacing="4">DYNASTY INTERNATIONAL</text>

  <rect x="4" y="4" width="248" height="248" fill="none" stroke="#C41A18" stroke-opacity="0.35" stroke-width="2"/>
