<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="三国志英杰传 title plate">
  <title>三国志英杰传</title>
  <defs>
    <linearGradient id="reko-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A1A22"/>
      <stop offset="0.55" stop-color="#6E1018"/>
      <stop offset="1" stop-color="#3C080D"/>
    </linearGradient>
    <linearGradient id="reko-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E7B4"/>
      <stop offset="0.5" stop-color="#DCBB55"/>
      <stop offset="1" stop-color="#B8912C"/>
    </linearGradient>
    <linearGradient id="reko-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E7"/>
      <stop offset="1" stop-color="#E8D7B4"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#reko-bg)"/>
  <rect x="5" y="5" width="246" height="246" fill="none" stroke="url(#reko-gold)" stroke-width="1.5" opacity="0.75"/>

  <!-- The KOEI-style diamond mark -->
  <g transform="translate(128 62)">
    <path d="M0 -40 L34 0 L0 40 L-34 0 Z" fill="none" stroke="url(#reko-gold)" stroke-width="3"/>
    <path d="M0 -25 L21 0 L0 25 L-21 0 Z" fill="url(#reko-gold)"/>
    <path d="M-34 0 L34 0" stroke="#3C080D" stroke-width="2.5"/>
  </g>

  <g text-anchor="middle" font-family="'Noto Serif CJK TC','Noto Serif TC','Songti TC','PMingLiU','Hiragino Mincho ProN',serif" font-weight="700" fill="url(#reko-cream)">
    <text x="128" y="160" font-size="47" letter-spacing="4">三國志英傑傳</text>
  </g>

  <rect x="46" y="176" width="164" height="1.5" fill="url(#reko-gold)" opacity="0.8"/>

  <g text-anchor="middle" font-family="Georgia,'Times New Roman',serif" fill="#EBD9A6">
    <text x="128" y="196" font-size="13" letter-spacing="4.5">SANGOKU EISEIDEN</text>
  </g>

  <g text-anchor="middle" font-family="Helvetica,Arial,sans-serif" fill="#C79A9F" opacity="0.9">
    <text x="128" y="226" font-size="11" letter-spacing="3">KOEI · 1995 · MS-DOS</text>
  </g>
</svg>
