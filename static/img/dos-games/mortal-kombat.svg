<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Mortal Kombat title plate">
  <title>Mortal Kombat</title>
  <defs>
    <radialGradient id="mk-bg" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#3A2A08"/>
      <stop offset="0.45" stop-color="#171206"/>
      <stop offset="1" stop-color="#070604"/>
    </radialGradient>
    <linearGradient id="mk-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE9A6"/>
      <stop offset="0.42" stop-color="#D4A72C"/>
      <stop offset="0.62" stop-color="#8A6212"/>
      <stop offset="1" stop-color="#E7C463"/>
    </linearGradient>
    <linearGradient id="mk-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEFF2"/>
      <stop offset="0.55" stop-color="#A9AFB8"/>
      <stop offset="1" stop-color="#5E646E"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#mk-bg)"/>
  <rect x="5" y="5" width="246" height="246" fill="none" stroke="url(#mk-gold)" stroke-width="1.5" opacity="0.55"/>

  <!-- The crossed blades: two slashes behind the wordmark -->
  <g opacity="0.5">
    <path d="M14 232 L214 44 L244 44 L44 232 Z" fill="url(#mk-gold)"/>
    <path d="M242 232 L42 44 L12 44 L212 232 Z" fill="url(#mk-steel)"/>
  </g>
  <rect x="0" y="96" width="256" height="64" fill="#070604" opacity="0.86"/>

  <g text-anchor="middle" font-family="'Arial Black',Impact,Haettenschweiler,'Franklin Gothic Bold',sans-serif" font-weight="900">
    <text x="128" y="126" font-size="46" fill="url(#mk-gold)" letter-spacing="2" transform="rotate(-2 128 126)">MORTAL</text>
    <text x="128" y="172" font-size="46" fill="url(#mk-steel)" letter-spacing="2" transform="rotate(-2 128 172)">KOMBAT</text>
  </g>

  <rect x="58" y="192" width="140" height="1.5" fill="url(#mk-gold)" opacity="0.8"/>

  <g text-anchor="middle" font-family="'Noto Sans CJK TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-weight="700" fill="#E4C766">
    <text x="128" y="222" font-size="24" letter-spacing="6">真人快打</text>
  </g>

  <g text-anchor="middle" font-family="Helvetica,Arial,sans-serif" fill="#9C8C5A" opacity="0.85">
    <text x="128" y="243" font-size="9.5" letter-spacing="2.5">ACCLAIM · PROBE · 1993 · MS-DOS</text>
  </g>
</svg>
