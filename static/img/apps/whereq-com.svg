<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none">
  <defs>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <clipPath id="pinClip">
      <path d="M32 2C18.7 2 8 12.7 8 26C8 44 32 78 32 78C32 78 56 44 56 26C56 12.7 45.3 2 32 2Z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Pin shape -->
  <path d="M32 2C18.7 2 8 12.7 8 26C8 44 32 78 32 78C32 78 56 44 56 26C56 12.7 45.3 2 32 2Z"
        fill="url(#pinGrad)" filter="url(#shadow)"/>

  <!-- Globe background circle -->
  <circle cx="32" cy="26" r="18" fill="url(#globeGrad)" opacity="0.9" clip-path="url(#pinClip)"/>

  <!-- Latitude lines -->
  <g clip-path="url(#pinClip)" stroke="rgba(255,255,255,0.35)" stroke-width="0.8" fill="none">
    <ellipse cx="32" cy="20" rx="18" ry="4"/>
    <ellipse cx="32" cy="26" rx="18" ry="6"/>
    <ellipse cx="32" cy="32" rx="18" ry="4"/>
  </g>

  <!-- Meridian lines -->
  <g clip-path="url(#pinClip)" stroke="rgba(255,255,255,0.35)" stroke-width="0.8" fill="none">
    <ellipse cx="32" cy="26" rx="4" ry="18"/>
    <ellipse cx="32" cy="26" rx="9" ry="18"/>
    <ellipse cx="32" cy="26" rx="14" ry="18"/>
  </g>

  <!-- Globe outline -->
  <circle cx="32" cy="26" r="18" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none" clip-path="url(#pinClip)"/>

  <!-- Center dot "you are here" -->
  <circle cx="32" cy="26" r="4" fill="white" opacity="0.95"/>
  <circle cx="32" cy="26" r="2" fill="url(#pinGrad)"/>
</svg>
